openapi: 3.0.0
info:
  title: PC Shop API
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: Health_check
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      description: Единый формат ошибки для всех ресурсов API.
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Money:
      type: integer
      format: int32
      minimum: 0
      description: Целая сумма в рублях, без копеек — в магазине одна валюта.
