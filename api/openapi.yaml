openapi: 3.0.0
info:
  title: PC Shop API
  version: 0.0.0
tags: []
paths:
  /api/auth/login:
    post:
      operationId: Auth_login
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/auth/logout:
    post:
      operationId: Auth_logout
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
  /api/auth/me:
    get:
      operationId: Auth_me
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/auth/register:
    post:
      operationId: Auth_register
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/categories:
    get:
      operationId: Categories_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /api/health:
    get:
      operationId: Health_check
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/products:
    get:
      operationId: Products_list
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: priceMin
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Money'
          explode: false
        - name: priceMax
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Money'
          explode: false
        - name: available
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: search
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/promo:
    get:
      operationId: Promo_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromoBlock'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      description: Единый формат ошибки для всех ресурсов API.
    Category:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        name:
          type: string
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
          description: Грубая проверка вида local(собака/at)domain.tld — не полный RFC 5322, ловит только явный мусор.
        password:
          type: string
    Money:
      type: integer
      format: int32
      minimum: 0
      description: Целая сумма в рублях, без копеек — в магазине одна валюта.
    Product:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - price
        - available
        - categorySlug
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        imageUrl:
          type: string
        available:
          type: boolean
        categorySlug:
          type: string
    ProductList:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
    PromoBlock:
      type: object
      required:
        - id
        - title
        - text
        - product
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        text:
          type: string
        product:
          $ref: '#/components/schemas/PromoBlockProduct'
    PromoBlockProduct:
      type: object
      required:
        - id
        - slug
        - name
        - price
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
          description: Грубая проверка вида local(собака/at)domain.tld — не полный RFC 5322, ловит только явный мусор.
        password:
          type: string
          minLength: 8
    User:
      type: object
      required:
        - id
        - email
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        email:
          type: string
        createdAt:
          type: string
          format: date-time
